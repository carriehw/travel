<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<title>飛啦喂！</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#fbfaf7}
#boot{position:fixed;inset:0;background:#fbfaf7}
#error{display:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang HK",sans-serif;padding:24px;color:#282221}
</style>
</head>
<body>
<div id="boot" aria-hidden="true"></div>
<div id="error"></div>
<script>
(async()=>{
  const count=24, expectedLength=9977709;
  try{
    const urls=Array.from({length:count},(_,i)=>'native/chunk-'+String(i).padStart(3,'0')+'.txt?v=21.1');
    const parts=await Promise.all(urls.map(async u=>{
      const r=await fetch(u,{cache:'no-store'});
      if(!r.ok) throw new Error(u+' '+r.status);
      return r.text();
    }));
    const source=parts.join('');
    if(source.length!==expectedLength) throw new Error('SOURCE_LENGTH_MISMATCH '+source.length);
    document.open();
    document.write(source);
    document.close();
  }catch(err){
    document.getElementById('boot')?.remove();
    const el=document.getElementById('error');
    el.style.display='block';
    el.textContent='載入失敗，請重新整理。';
    console.error('[飛啦喂 v21.1]',err);
  }
})();
</script>
</body>
</html>
