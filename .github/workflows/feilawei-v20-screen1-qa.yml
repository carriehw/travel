name: Feilawei v20 Screen 1 QA

on:
  push:
    branches:
      - chatgpt/feilawei-v20-golden-master
    paths:
      - "feilawei/**"
      - ".github/workflows/feilawei-v20-screen1-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screen1:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: feilawei/qa/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python QA dependency
        run: python -m pip install "Pillow>=11,<12"

      - name: Install Node QA dependencies
        run: npm ci --prefix feilawei/qa

      - name: Install Playwright browsers
        run: npx --prefix feilawei/qa playwright install --with-deps chromium webkit

      - name: Prepare QA output
        run: mkdir -p feilawei/docs/qa/latest

      - name: Validate canonical artboard and provenance
        run: python feilawei/qa/validate-assets.py --output feilawei/docs/qa/latest/asset-validation.json

      - name: Run browser geometry and interaction QA
        run: node feilawei/qa/capture-screen1.cjs feilawei/docs/qa/latest

      - name: Build Reference / Live / Overlay review
        run: python feilawei/qa/build-review.py feilawei/docs/qa/latest

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feilawei-screen1-qa
          path: feilawei/docs/qa/latest
          retention-days: 14
