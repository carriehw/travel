name: Feilawei v20 Screen 1 QA

on:
  push:
    branches:
      - chatgpt/feilawei-v20-golden-master
    paths:
      - "feilawei/index.html"
      - "feilawei/screen1.css"
      - "feilawei/screen1.js"
      - "feilawei/assets/reference/**"
      - "feilawei/qa/**"
      - ".github/workflows/feilawei-v20-screen1-qa.yml"
  workflow_dispatch:

concurrency:
  group: feilawei-v20-screen1
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screen1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: feilawei/qa/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=11,<12"
      - run: npm ci --prefix feilawei/qa
      - run: npx --prefix feilawei/qa playwright install --with-deps chromium webkit
      - run: mkdir -p feilawei/docs/qa/latest
      - name: Validate real Traditional Chinese renderer inputs
        run: python feilawei/qa/validate-assets.py --output feilawei/docs/qa/latest/asset-validation.json
      - name: Run browser geometry, copy and interaction QA
        run: node feilawei/qa/capture-screen1.cjs feilawei/docs/qa/latest
      - name: Build Reference / Live / Overlay evidence
        run: python feilawei/qa/build-review.py feilawei/docs/qa/latest
      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feilawei-screen1-qa
          path: feilawei/docs/qa/latest
          retention-days: 14
