<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fff8ec">
<title>飛啦喂！Exact Image Build v2</title>
<style>
:root{--paper:#fff8ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;background:var(--paper);overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#app{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:var(--paper)}
.stage{position:relative;width:min(100vw,calc(100dvh * 941 / 1672));aspect-ratio:941/1672;overflow:hidden;background:var(--paper)}
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}
.screen>img{display:block;width:100%;height:100%;object-fit:fill;user-select:none;-webkit-user-drag:none;pointer-events:none}
.hotspot{position:absolute;border:0;background:transparent!important;padding:0;margin:0;cursor:pointer;outline:none;appearance:none;-webkit-appearance:none}
.hotspot:focus,.hotspot:active{outline:none;background:transparent!important;box-shadow:none}
</style>
</head>
<body>
<div id="app"><main class="stage" aria-live="polite">
  <section class="screen active" id="home" aria-label="首頁">
    <img src="assets/home.png" alt="飛啦喂！首頁">
    <button class="hotspot" aria-label="開始飛啦" style="left:20.5%;top:80.0%;width:59%;height:8.1%" onclick="go('mode')"></button>
    <button class="hotspot" aria-label="命運盲抽盒" style="left:28%;top:89.1%;width:44%;height:6.5%" onclick="state.mode='fate';go('blindbox')"></button>
  </section>

  <section class="screen" id="mode" aria-label="玩法選擇">
    <img src="assets/mode.png" alt="今次想點樣飛">
    <button class="hotspot" aria-label="精準飛" style="left:4.5%;top:28.0%;width:45%;height:24.4%" onclick="pickMode('match')"></button>
    <button class="hotspot" aria-label="快快飛" style="left:50.5%;top:28.0%;width:45%;height:24.4%" onclick="pickMode('fast')"></button>
    <button class="hotspot" aria-label="亂咁飛" style="left:4.5%;top:53.7%;width:45%;height:25.0%" onclick="pickMode('random')"></button>
    <button class="hotspot" aria-label="一班人飛" style="left:50.5%;top:53.7%;width:45%;height:25.0%" onclick="pickMode('group')"></button>
    <button class="hotspot" aria-label="下一步" style="left:20.5%;top:82.9%;width:59%;height:8.4%" onclick="go('question1')"></button>
    <button class="hotspot" aria-label="返回首頁" style="left:3%;top:2%;width:13%;height:8%" onclick="go('home')"></button>
  </section>

  <section class="screen" id="question1" aria-label="第一題">
    <img src="assets/question1.png" alt="第一題：今次你想同邊個一齊飛">
    <button class="hotspot" aria-label="自己一個慢慢玩" style="left:5.1%;top:48.4%;width:44.5%;height:15.5%" onclick="answerQ1('solo')"></button>
    <button class="hotspot" aria-label="同朋友一齊癲" style="left:50.5%;top:48.4%;width:44.3%;height:15.5%" onclick="answerQ1('friends')"></button>
    <button class="hotspot" aria-label="同另一半甜蜜飛" style="left:5.1%;top:65.0%;width:44.5%;height:15.5%" onclick="answerQ1('couple')"></button>
    <button class="hotspot" aria-label="同屋企人齊齊去" style="left:50.5%;top:65.0%;width:44.3%;height:15.5%" onclick="answerQ1('family')"></button>
    <button class="hotspot" aria-label="下一題" style="left:21%;top:83.4%;width:58%;height:8.4%" onclick="go('blindbox')"></button>
    <button class="hotspot" aria-label="返回玩法選擇" style="left:3%;top:2%;width:13%;height:8%" onclick="go('mode')"></button>
  </section>

  <section class="screen" id="blindbox" aria-label="盲盒選擇">
    <img src="assets/blindbox.png" alt="揀個盲盒先">
    <button class="hotspot" aria-label="城市散心盒" style="left:4.5%;top:24.1%;width:45%;height:18.8%" onclick="chooseBox('city')"></button>
    <button class="hotspot" aria-label="自然放空盒" style="left:50.5%;top:24.1%;width:45%;height:18.8%" onclick="chooseBox('nature')"></button>
    <button class="hotspot" aria-label="海島 Chill 盒" style="left:4.5%;top:43.5%;width:45%;height:18.9%" onclick="chooseBox('island')"></button>
    <button class="hotspot" aria-label="美食暴走盒" style="left:50.5%;top:43.5%;width:45%;height:18.9%" onclick="chooseBox('food')"></button>
    <button class="hotspot" aria-label="打卡靚景盒" style="left:4.5%;top:62.7%;width:45%;height:18.9%" onclick="chooseBox('photo')"></button>
    <button class="hotspot" aria-label="命運盲抽盒" style="left:50.5%;top:62.7%;width:45%;height:18.9%" onclick="chooseBox('fate')"></button>
    <button class="hotspot" aria-label="確認開盒" style="left:19.5%;top:88.0%;width:61%;height:8.4%" onclick="go('result')"></button>
    <button class="hotspot" aria-label="返回" style="left:3%;top:2%;width:13%;height:8%" onclick="go('question1')"></button>
  </section>

  <section class="screen" id="result" aria-label="開盒結果">
    <img src="assets/result.png" alt="開盒結果：福岡">
    <button class="hotspot" aria-label="分享旅程卡" style="left:5.2%;top:87.5%;width:52.5%;height:8.5%" onclick="shareResult()"></button>
    <button class="hotspot" aria-label="再抽一次" style="left:59.3%;top:87.5%;width:35.8%;height:8.5%" onclick="resetApp()"></button>
    <button class="hotspot" aria-label="返回" style="left:3%;top:2%;width:13%;height:8%" onclick="go('blindbox')"></button>
  </section>
</main></div>
<script>
const state={mode:null,q1:null,box:null};
function go(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
function pickMode(v){state.mode=v}
function answerQ1(v){state.q1=v}
function chooseBox(v){state.box=v}
function resetApp(){state.mode=null;state.q1=null;state.box=null;go('home')}
async function shareResult(){const data={title:'飛啦喂！',text:'我喺飛啦喂！抽到福岡 ✈️'};if(navigator.share){try{await navigator.share(data)}catch(e){}}}
</script>
</body>
</html>
