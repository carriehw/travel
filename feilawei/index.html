<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>飛啦喂！</title>
<link rel="stylesheet" href="./style.css?v=13">
</head>
<body>
<main class="app">

<section id="home" class="screen active master-screen master-home">
  <div class="master-canvas master-canvas-home">
    <img class="master-art" src="./assets/master/screen1.webp?v=12" alt="飛啦喂首頁定稿">
    <button class="hotspot home-start" data-go="travelType" aria-label="開始飛啦"></button>
    <span class="motion-spark spark-one">✦</span>
    <span class="motion-spark spark-two">✦</span>
  </div>
</section>

<section id="travelType" class="screen master-screen master-type">
  <div class="master-canvas master-canvas-type">
    <img class="master-art" src="./assets/master/screen2.webp?v=12" alt="旅程類型定稿">
    <button class="hotspot back-hotspot" data-go="home" aria-label="返回"></button>
    <button class="hotspot type-hotspot type-1" data-vibe="relax" aria-label="Chill 放鬆"></button>
    <button class="hotspot type-hotspot type-2" data-vibe="city" aria-label="城市探索"></button>
    <button class="hotspot type-hotspot type-3" data-vibe="nature" aria-label="自然風景"></button>
    <button class="hotspot type-hotspot type-4" data-vibe="food" aria-label="美食之旅"></button>
    <button class="hotspot type-hotspot type-5" data-vibe="heal" aria-label="療癒放空"></button>
    <button class="hotspot type-hotspot type-6" data-vibe="surprise" aria-label="隨機驚喜"></button>
    <span class="motion-spark type-spark">✦</span>
  </div>
</section>

<section id="companion" class="screen master-screen master-companion">
  <div class="master-canvas master-canvas-companion">
    <img class="master-art" src="./assets/master/screen3.webp?v=12" alt="旅伴選擇定稿">
    <button class="hotspot back-hotspot" data-go="travelType" aria-label="返回"></button>
    <button class="hotspot companion-hotspot companion-1" data-companion="solo" aria-label="自己一個"></button>
    <button class="hotspot companion-hotspot companion-2" data-companion="couple" aria-label="情侶或伴侶"></button>
    <button class="hotspot companion-hotspot companion-3" data-companion="friends" aria-label="朋友"></button>
    <button class="hotspot companion-hotspot companion-4" data-companion="family" aria-label="家庭"></button>
    <button class="hotspot companion-hotspot companion-5" data-companion="captain" aria-label="交俾小天線隊長"></button>
  </div>
</section>

<section id="conditions" class="screen">
  <header class="topbar">
    <button class="back" data-go="companion">‹</button>
    <div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
    <span class="count">3/8</span>
  </header>
  <div class="paint-title wide">設定你嘅旅程條件</div>
  <p class="subtitle">話多啲俾我知，我會搵最啱嘅目的地！</p>

  <div class="condition-panel">
    <h3>🗓️ 旅行日數</h3>
    <div class="seg days">
      <button data-days="3">1–3日</button><button data-days="7">4–7日</button><button data-days="14">8–14日</button><button data-days="20">14日以上</button>
    </div>
  </div>
  <div class="condition-panel">
    <h3>✈️ 旅行距離</h3>
    <div class="distance-row">
      <button data-distance="short"><span class="radio">✓</span><b>短途</b><small>亞洲・3–5小時內</small></button>
      <button data-distance="long"><span class="radio"></span><b>長途</b><small>其他地區・5小時以上</small></button>
    </div>
  </div>
  <div class="condition-panel">
    <h3>🪙 預算（每人）</h3>
    <div class="seg budget">
      <button data-budget="1">經濟<small>HK$3,000以下</small></button><button data-budget="2">標準<small>HK$3,000–8,000</small></button><button data-budget="3">豪華<small>HK$8,000以上</small></button>
    </div>
  </div>
  <div class="condition-panel">
    <h3>🌎 地區偏好</h3>
    <div class="region-grid">
      <button data-region="asia">⛩️ 亞洲</button><button data-region="europe">🗼 歐洲</button><button data-region="america">🗽 美洲</button><button data-region="oceania">🌊 大洋洲</button><button data-region="middleeast">🕌 中東</button><button data-region="any">🌴 其他</button>
    </div>
  </div>
  <button class="primary-btn sticky-next" id="conditionsNext">下一步 →</button>
</section>

<section id="visited" class="screen">
  <header class="topbar">
    <button class="back" data-go="conditions">‹</button>
    <div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
    <span class="count">4/8</span>
  </header>
  <div class="paint-title wide small-title">有冇去過 / 唔想去嘅地方？</div>
  <p class="subtitle">揀返去過嘅地方，或者今次唔想去嘅目的地！</p>
  <div class="searchbar">🔍 <input id="placeSearch" placeholder="搜尋國家／城市（例如：日本、曼谷）"></div>
  <div class="memory-modes">
    <button id="modeVisited" class="active">✓ 我去過 <b id="visitedCount">0</b></button>
    <button id="modeExcluded">✕ 今次唔想去 <b id="excludedCount">0</b></button>
  </div>
  <div id="placeGrid" class="place-grid"></div>
  <button id="memoryNext" class="memory-tip"><img src="./mascot.png?v=13" class="mascot tiny" alt=""><span>揀好去過／唔想去嘅地方<br><b>我會幫你避開佢哋！ →</b></span></button>
</section>

<section id="boxes" class="screen">
  <header class="topbar box-head">
    <button class="back" data-go="visited">‹</button>
    <div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i></div>
    <span class="count">5/8</span>
  </header>
  <div class="box-title"><small>揀一個</small><strong>你心儀嘅盲盒！</strong><em>12個目的地<br>等你發掘！</em></div>
  <div id="boxGrid" class="box-grid"></div>
</section>

<section id="reveal" class="screen reveal">
  <header class="topbar reveal-head"><span></span><div class="progress"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div><span class="count">6/8</span></header>
  <div id="confettiField"></div>
  <div class="reveal-title">準備揭曉<br>你嘅下一站…</div>
  <div class="countdown"><span class="n3">3</span><i>…</i><span class="n2">2</span><i>…</i><span class="n1">1</span></div>
  <div class="open-box">
    <div class="lid"></div>
    <div class="question">?</div>
    <img src="./mascot.png?v=13" class="mascot popup" alt="">
  </div>
  <div class="adventure-note">Let the<br>adventure begin! ✈</div>
</section>

<section id="result" class="screen result">
  <div class="result-label">你嘅下一站係…</div>
  <div class="postcard">
    <div class="stamp">✈</div>
    <h2 id="resultCity">京都</h2>
    <div id="resultEn" class="result-en">Kyoto, Japan</div>
    <div id="resultHero" class="result-hero"></div>
    <div class="photo polaroid-a" id="resultMini1"></div>
    <div class="photo polaroid-b" id="resultMini2"></div>
    <img src="./mascot.png?v=13" class="mascot result-mascot" alt="">
  </div>
  <div class="reason-card"><strong>為你推薦嘅原因：</strong><ul id="reasons"></ul></div>
  <button class="primary-btn save" id="saveResult">保存結果 ♥</button>
  <button class="again" id="reroll">↻ 再抽一次</button>
</section>

</main>

<div id="advancedSheet" class="sheet">
  <div class="sheet-card">
    <button class="sheet-close" id="sheetClose">×</button>
    <div class="sheet-title">再補充少少 ✨</div>
    <p>只會問同你今次旅程有關嘅條件，唔使填長問卷。</p>
    <div id="conditionalQuestions"></div>
    <button class="primary-btn" id="advancedDone">完成，幫我配對 →</button>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="./app.js?v=13"></script>
</body>
</html>
