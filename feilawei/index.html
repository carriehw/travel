<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8e9">
  <meta name="robots" content="noindex,nofollow">
  <title>飛啦喂！</title>
  <link rel="stylesheet" href="./screen1.css?v=20.2">
  <script src="./screen1.js?v=20.2" defer></script>
</head>
<body>
  <main class="app">
    <section id="home" class="v20-home-screen" aria-labelledby="home-title" aria-busy="true" data-asset-status="loading">
      <div class="v20-artboard" data-design-width="390" data-design-height="788.4">
        <header class="sr-only">
          <h1 id="home-title">飛啦喂！</h1>
          <p>外星旅人・地球導遊</p>
          <h2>想去邊？抽咗先算。</h2>
        </header>
        <ol class="sr-only" aria-label="三步玩法">
          <li>揀條件，話你知想點玩</li>
          <li>揀盲盒，揀你心儀嘅盒</li>
          <li>揭曉下一站，睇吓去邊！</li>
        </ol>
        <div id="screen1-artwork" class="v20-artwork" aria-hidden="true"></div>
        <button id="screen1-start" class="v20-start-hotspot" type="button" aria-label="開始飛啦" disabled></button>
        <div class="sr-only">
          <p lang="en">You only live once</p>
          <p>人生得一次，仲等咩？飛啦喂！</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
