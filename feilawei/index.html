<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8e9">
  <meta name="robots" content="noindex,nofollow">
  <title>飛啦喂！</title>
  <link rel="stylesheet" href="./screen1.css?v=20.4">
  <script src="./screen1.js?v=20.4" defer></script>
</head>
<body>
  <main class="app">
    <section id="home" class="home-screen" aria-labelledby="home-title">
      <div class="artboard">
        <div class="blob blob-yellow" aria-hidden="true"><span class="face"></span></div>
        <div class="blob blob-pink" aria-hidden="true"><span class="face"></span></div>
        <div class="blob blob-blue" aria-hidden="true"></div>
        <div class="blob blob-peach" aria-hidden="true"></div>
        <div class="blob blob-green" aria-hidden="true"></div>
        <div class="blob blob-purple" aria-hidden="true"></div>

        <header class="brand">
          <img class="brand-art" src="./assets/v20/screen01_brand.svg" alt="" aria-hidden="true">
          <p>外星旅人・地球導遊</p>
        </header>

        <h1 id="home-title" class="sr-only">想去邊？抽咗先算。</h1>
        <img class="hero-title-art" src="./assets/v20/screen01_title.svg" alt="" aria-hidden="true">

        <div class="mascot-window" aria-hidden="true">
          <img src="./assets/reference/小天線隊長旅行角色設定圖.png" alt="">
        </div>

        <div class="lets-go" aria-hidden="true">LET'S<br>GO!</div>

        <svg class="route" viewBox="0 0 390 805" aria-hidden="true">
          <path d="M118 566 C160 588, 190 564, 214 533 S282 474, 310 500 S326 543, 304 569"
                fill="none" stroke="#45bfc0" stroke-width="4" stroke-linecap="round"
                stroke-dasharray="9 11"/>
          <path d="M210 536 l14 -7 l-7 14" fill="none" stroke="#48a9e7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>

        <section class="steps" aria-label="三步玩法">
          <article class="step step-one">
            <div class="icon-circle yellow">
              <svg viewBox="0 0 64 64" role="img" aria-label="揀條件">
                <rect x="18" y="14" width="30" height="38" rx="4" fill="#fff" stroke="#1786bd" stroke-width="4"/>
                <rect x="25" y="9" width="16" height="10" rx="3" fill="#9be6d4" stroke="#1786bd" stroke-width="3"/>
                <path d="M25 29h16M25 37h16M25 45h12" stroke="#32b79c" stroke-width="3" stroke-linecap="round"/>
                <path d="M20 28l2 2 4-5M20 36l2 2 4-5M20 44l2 2 4-5" fill="none" stroke="#f26e67" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <h2>揀條件</h2>
            <p>話你知想點玩</p>
          </article>

          <article class="step step-two">
            <div class="icon-circle butter">
              <svg viewBox="0 0 64 64" role="img" aria-label="揀盲盒">
                <path d="M15 28h34v26H15z" fill="#f78a58" stroke="#2a658f" stroke-width="3"/>
                <path d="M12 22h40v10H12z" fill="#ffb95f" stroke="#2a658f" stroke-width="3"/>
                <path d="M30 22v32M36 22v32" stroke="#fff4d8" stroke-width="4"/>
                <path d="M32 20c-9 0-13-4-11-8 2-4 9-1 11 8zm2 0c9 0 13-4 11-8-2-4-9-1-11 8z" fill="#ff6e6f" stroke="#2a658f" stroke-width="2.5"/>
              </svg>
            </div>
            <h2>揀盲盒</h2>
            <p>揀你心儀嘅盒</p>
          </article>

          <article class="step step-three">
            <div class="icon-circle blue">
              <svg viewBox="0 0 64 64" role="img" aria-label="揭曉下一站">
                <circle cx="32" cy="32" r="24" fill="#79c3f2"/>
                <path d="M18 32l11 3 14-10c3-2 6 0 4 3L36 39l3 9-5 2-7-8-8 2-2-4 7-5-8-2z" fill="#fff" stroke="#2a658f" stroke-width="2.4" stroke-linejoin="round"/>
              </svg>
            </div>
            <h2>揭曉下一站</h2>
            <p>睇吓去邊！</p>
          </article>
        </section>

        <button id="screen1-start" class="start-btn" type="button" aria-label="開始飛啦">
          <span>開始飛啦</span><span aria-hidden="true">✈</span><span aria-hidden="true">→</span>
        </button>

        <footer class="slogan">
          <p lang="en">You only live once</p>
          <p>人生得一次，仲等咩？飛啦喂！</p>
        </footer>
      </div>
    </section>
  </main>
</body>
</html>
